<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shorts Studio AI</title><link rel="stylesheet" href="styles.css"><script defer src="app.js"></script></head><body>
<header class="topbar"><a class="brand" href="#"><span class="brand-mark">S</span><span>SHORTS STUDIO <b>AI</b></span></a><button id="settings-button" class="icon-button">⚙</button></header>
<main class="layout"><section class="intro"><p class="eyebrow">YOUR CREATIVE CO-PILOT</p><h1>Make a short<br><span>worth watching.</span></h1><p>Get fresh concepts and shape them into a script. Your ideas stay in this browser.</p></section>
<section class="workspace"><section class="panel"><h2>What are we making?</h2><form id="brief-form"><label>Topic <input id="topic" required placeholder="e.g. strange space discoveries"></label><div class="row"><label>Audience<input id="audience" placeholder="Curious beginners"></label><label>Tone<select id="tone"><option>Curious and surprising</option><option>Funny and energetic</option><option>Mysterious and cinematic</option><option>Clear and educational</option></select></label></div><div class="row"><label>Length<select id="duration"><option value="30">About 30 seconds</option><option value="45">About 45 seconds</option><option value="60">About 60 seconds</option></select></label><label>Format<select id="format"><option>Faceless narrated short</option><option>Animated explainer</option><option>Mini documentary</option><option>Story with a twist</option></select></label></div><label>Anything to avoid<input id="avoid" placeholder="Optional"></label><button id="generate-button" class="primary">Generate fresh ideas →</button></form></section>
<section id="results-section" hidden><h2>Pick a direction</h2><div id="results" class="ideas"></div></section><section><div class="history-head"><h2>Recent ideas</h2><button id="clear-history" class="text-button">Clear history</button></div><div id="history-list"></div></section></section></main>
<dialog id="settings-dialog"><form method="dialog"><button class="dialog-close">×</button></form><p class="eyebrow">LOCAL AI SETTINGS</p><h2>Connect your model</h2><label>Model</label><div class="row"><select id="model-select"><option value="llama3.2:3b">llama3.2:3b</option></select><input id="model-name" value="llama3.2:3b"></div><p id="connection-status">Check Ollama connection</p><button id="refresh-models" class="secondary" type="button">Check connection</button><button id="save-settings" class="primary" type="button">Save settings</button></dialog>
<dialog id="script-dialog"><form method="dialog"><button class="dialog-close">×</button></form><p class="eyebrow">SCRIPT DRAFT</p><h2 id="script-title"></h2><p id="script-hook"></p><div id="script-lines"></div><div id="script-sources"></div><button id="copy-script" class="secondary" type="button">Copy script</button><button id="download-script" class="primary" type="button">Download JSON</button></dialog><div id="toast" role="status"></div></body></html>
